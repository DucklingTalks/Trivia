<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Trivia — Juegos interactivos para equipos</title>
  <desc id="description">Una alternativa gratuita para crear trivias y jugar en tiempo real con equipos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1030" cy="90" r="220" fill="#6366f1" opacity="0.16" />
  <circle cx="1120" cy="560" r="300" fill="#a855f7" opacity="0.12" />
  <rect x="92" y="96" width="12" height="438" rx="6" fill="url(#accent)" />
  <text x="150" y="260" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700">Trivia</text>
  <text x="154" y="332" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="34">Juegos interactivos para equipos</text>
  <text x="154" y="414" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="27">Capacitaciones · team building · eventos internos</text>
  <text x="154" y="490" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="24">Creá partidas y jugá en tiempo real desde cualquier dispositivo.</text>
